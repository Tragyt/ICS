name: pipeline

on:
    push: {}

jobs:

    lint-python:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v6
            - name: Setup python
              uses: actions/setup-python@v6
              with:
                python-version: 3
            - name: Install flake8
              run: |
                python -m pip install --upgrade pip
                python -m pip install flake8
            - name: Run flake8
              run: flake8 --exclude ./webauth/userhandler/app/migrations/  .

    lint-docker:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v3
        - name: Hadolint
          uses: hadolint/hadolint-action@v3.1.0
          with:
            dockerfile: Dockerfile
            recursive: true

    lint-docker-compose:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v6
        - name: dclint
          run: |
            for f in $(find . -type f -name "docker-compose.*"); do 
              docker run -t --rm -v ${PWD}:/app zavoloklom/dclint $f 
            done

    test-network:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v6
        - name: Run containers
          run: |
            cp .env.example .env;
            docker compose up --build -d
        - name: Test plcs
          run: |
            all_healthy=false
            until [[ $all_healthy == true ]];
            do
                sleep 2
                plc1_status=$(docker inspect -f '{{.State.Status}}' plc1)
                plc2_status=$(docker inspect -f '{{.State.Status}}' plc2)
                plc3_status=$(docker inspect -f '{{.State.Status}}' plc3)
                plc4_status=$(docker inspect -f '{{.State.Status}}' plc4)

                if [[ "$plc1_status" == "exited" || "$plc1_status" == "dead" ]]; then
                  echo "plc1 error"
                  exit 1
                fi
                if [[ "$plc2_status" == "exited" || "$plc2_status" == "dead" ]]; then
                  echo "plc2 error"
                  exit 1
                fi
                if [[ "$plc3_status" == "exited" || "$plc3_status" == "dead" ]]; then
                  echo "plc3 error"
                  exit 1
                fi
                if [[ "$plc4_status" == "exited" || "$plc4_status" == "dead" ]]; then
                  echo "plc4 error"
                  exit 1
                fi

                if [[ "$(docker inspect -f '{{.State.Health.Status}}' plc1)" == "healthy" \
                    && "$(docker inspect -f '{{.State.Health.Status}}' plc2)" == "healthy" \
                    && "$(docker inspect -f '{{.State.Health.Status}}' plc3)" == "healthy" \
                    && "$(docker inspect -f '{{.State.Health.Status}}' plc4)" == "healthy" ]]; then
                  all_healthy=true
                fi
            done
        - name: Test hils
          run: |
            sleep 2
            docker logs hil1 | grep -q Waiting
            docker logs hil2 | grep -q Waiting
            docker logs hil3 | grep -q Waiting
            docker logs hil4 | grep -q Waiting

        - name: Test nginx and logingateway
          run: |
            if [[ 302 != $(curl -w "%{http_code}" -o /dev/null -s "http://localhost:5050/plc1/") ]]; then
              exit 1
            fi

        - name: Test scada
          run: |
            docker logs scada | grep -q "import done!"

        - name: Test userhandler
          run: |
            if [[ 200 != $(docker exec user_handler curl -o /dev/null -s -w %{http_code} "http://localhost:5000") ]]; then
              exit 1
            fi
        