name: pipeline

on:
    push: {}

jobs:

    lint-pipeline:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repo
            uses: actions/checkout@v6
          - name: actionlint
            run: docker run --rm -v "$(pwd)":/repo --workdir /repo rhysd/actionlint:latest -color

    lint-python:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v6
            - name: Setup python
              uses: actions/setup-python@v6
              with:
                python-version: 3
            - name: Install flake8
              run: |
                python -m pip install --upgrade pip
                python -m pip install flake8
            - name: Run flake8
              run: flake8 --exclude ./webauth/userhandler/app/migrations/  .

    lint-docker:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v6
        - name: Hadolint
          uses: hadolint/hadolint-action@v3.1.0
          with:
            dockerfile: Dockerfile
            recursive: true

    lint-docker-compose:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v6
        - name: dclint
          run: find . -type f -name "docker-compose.*" -exec docker run -t --rm -v "${PWD}:/app" zavoloklom/dclint {} \;

    lint-shell:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v6
        - name: shellcheck
          run: find . -type f -name "*.sh" -exec shellcheck {} \;

    lint-html:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v6
        - name: Setup node
          uses: actions/setup-node@v6
        - name: Install dependecies
          run: sudo apt-get update && sudo apt-get install -y jq
        - name: htmlhint
          run: |
            yarn add --dev htmlhint
            npx htmlhint --init
            jq '. + {"doctype-first": false}' .htmlhintrc > tmp && mv tmp .htmlhintrc
            npx htmlhint "**/*.html"
