name: pipeline

on:
    push: {}

jobs:

    lint-python:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v6
            - name: Setup python
              uses: actions/setup-python@v6
              with:
                python-version: 3
            - name: Install flake8
              run: |
                python -m pip install --upgrade pip
                python -m pip install flake8
            - name: Run flake8
              run: flake8 --exclude ./webauth/userhandler/app/migrations/  .

    lint-docker:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v3
        - name: Hadolint
          uses: hadolint/hadolint-action@v3.1.0
          with:
            dockerfile: Dockerfile
            recursive: true

    lint-docker-compose:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v6
        - name: dclint
          run: |
            for f in $(find . -type f -name "docker-compose.*"); do 
              docker run -t --rm -v ${PWD}:/app zavoloklom/dclint $f 
            done