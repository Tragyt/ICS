name: pipeline

on:
  push: {}

jobs:
  set-modified-files:
    runs-on: ubuntu-latest
    outputs:
      python-files: ${{steps.set-files.outputs.python-files}}
      docker-files: ${{steps.set-files.outputs.docker-files}}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set changed files
        id: set-files
        run: |
          FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }})
          echo "Changed files:"
          echo "$FILES"

          echo "python-files=$(echo "$FILES" | grep '\.py$' || true)" >> "$GITHUB_OUTPUT"
          echo "docker-files=$(echo "$FILES" | grep 'Dockerfile$' || true)" >> "$GITHUB_OUTPUT"

  lint-python:
    runs-on: ubuntu-latest
    needs: set-modified-files
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
      - name: Run flake8
        run: flake8 --exclude ./webauth/userhandler/app/migrations/  ${{needs.set-modified-files.outputs.python-files}}

  lint-docker:
    runs-on: ubuntu-latest
    needs: set-modified-files
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Hadolint
        run: |
          for f in ${{needs.set-modified-files.outputs.docker-files}}; do
            docker run --rm -i hadolint/hadolint < "$f"
          done
