- name: color sensor
  hosts: arm1
  ignore_unreachable: yes
  tasks:
    - name: install build dependencies
      apt:
        name:
          - python3-dev
          - build-essential
          - gcc
        state: present
        update_cache: yes
      become: yes
    - name: check if i2c is enabled
      shell: grep "dtparam=i2c_arm=on" /boot/firmware/config.txt
      register: i2c_status
      become: yes
    - name: enable i2c
      command: raspi-config nonint do_i2c 0
      when: i2c_status.rc is defined and i2c_status.rc != 0
      become: yes
    - name: copy files
      copy:
        src: '../hil/color_sensor'
        dest: '/home/aces/'
    - name: Create venv
      ansible.builtin.command:
        cmd: python3 -m venv /home/aces/color_sensor/venv
        creates: /home/aces/color_sensor/venv/bin/activate
    - name: install requirements
      command: /home/aces/color_sensor/venv/bin/pip install -r /home/aces/color_sensor/requirements.txt
    - name: Reboot the system
      reboot:
        reboot_timeout: 300
      when: i2c_status.rc is defined and i2c_status.rc != 0

