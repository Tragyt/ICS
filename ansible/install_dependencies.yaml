- name: install docker
  hosts: [scada,controller,router,db,userhandler,logingateway,plc]
  become: yes
  ignore_unreachable: yes
  tasks:
    - name: get docker install script
      get_url:
        url: https://get.docker.com
        dest: /home/aces/get-docker.sh
        mode: '0755'
    - name: install docker
      command: /home/aces/get-docker.sh
      args: 
        creates: /usr/bin/docker
    - name: add aces to docker group
      user:
        name: aces
        groups: docker
        append: yes
    - name: create docker cli plugins dir
      file:
        path: /home/aces/.docker/cli-plugins
        state: directory
        owner: aces
        group: aces
        mode: '0755'

    - name: install docker compose plugin (64 bit)
      get_url:
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-aarch64
        dest: /home/aces/.docker/cli-plugins/docker-compose
        owner: aces
        group: aces
        mode: '0755'

