- name: nginx
  hosts: [plc,scada]
  ignore_unreachable: yes
  tasks:
    - name: copy dir
      copy:
        src: '../nginx'
        dest: '/home/aces/'
        mode: '0755'
- name: install openplc
  hosts: plc
  become: yes
  ignore_unreachable: yes
  tasks:
    - name: Install dependencies
      apt:
        name:
          - python3-pip
        update-cache: yes
        state: present
    - name: Clone repo
      git:
        repo: "https://github.com/thiagoralves/OpenPLC_v3.git"
        dest: "/home/aces/openplc/OpenPLC_v3"
        update: false
    - name: install openplc
      command: ./install.sh rpi
      args:
        chdir: /home/aces/openplc/OpenPLC_v3
        creates: /home/aces/openplc/OpenPLC_v3/start_openplc.sh
      register: openplc
    - name: copy files
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0755'
      loop:
        - { src: '../plc/run.sh', dest: '/home/aces/openplc/run.sh' }
        - { src: '../plc/setup.sh', dest: '/home/aces/openplc/setup.sh' }
        - { src: '../plc/start_plc.py', dest: '/home/aces/openplc/start_plc.py' }
        - { src: '../plc/arm_plc.st', dest: '/home/aces/openplc/arm_plc.st'}
        - { src: '../plc/requirements.txt', dest: '/home/aces/openplc/requirements.txt'}
    - name: Create venv
      ansible.builtin.command:
        cmd: python3 -m venv /home/aces/openplc/venv
        creates: /home/aces/openplc/venv/bin/activate
    - name: Install requirements
      pip:
        requirements: /home/aces/openplc/requirements.txt
        virtualenv: /home/aces/openplc/venv
        virtualenv_python: python3
    - name: Setup openplc
      command: ./setup.sh
      args:
        chdir: /home/aces/openplc
        creates: /home/aces/openplc/OpenPLC_v3/webserver/st_files/arm_plc.st
    
