- name: ziti setup
  hosts: ziti
  ignore_unreachable: yes
  tasks:
    - name: ensure /home/aces/ziti exists
      ansible.builtin.file:
        path: /home/aces/ziti
        state: directory
        owner: aces
        group: aces
        mode: '0755'      
    - name: download ziti install script
      get_url:
        url: https://get.openziti.io/install.bash
        dest: /tmp/install_openziti.sh
        mode: '0755'
      become: true
    - name: install ziti cli
      command: /tmp/install_openziti.sh openziti
      args:
        creates: /usr/local/bin/ziti 
      become: true

