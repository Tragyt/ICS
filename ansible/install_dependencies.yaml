- name: ziti tunnelers
  hosts: tunneler
  ignore_unreachable: yes
  tasks:
    - name: copy files
      copy:
        src: '../ziti/.env.ziti'
        dest: '/home/aces/ziti/.env'
        mode: '0755'
    - name: add OpenZiti apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/openziti.gpg] https://packages.openziti.org/zitipax-openziti-deb-stable jammy main"
        filename: openziti
        state: present
      become: true
    - name: download OpenZiti repository key
      ansible.builtin.get_url:
        url: https://get.openziti.io/tun/package-repos.gpg
        dest: /tmp/openziti.gpg
        mode: '0644'
      become: true
    - name: add key to keyring
      ansible.builtin.command:
        cmd: gpg --dearmor --yes --output /usr/share/keyrings/openziti.gpg /tmp/openziti.gpg
      args:
        creates: /usr/share/keyrings/openziti.gpg
      become: true
    - name: ensure key permissions
      ansible.builtin.file:
        path: /usr/share/keyrings/openziti.gpg
        mode: '0644'
      become: true
    - name: install ziti-edge-tunnel
      ansible.builtin.apt:
        name: ziti-edge-tunnel
        state: present
        update_cache: yes
      become: true
    - name: create systemd override directory
      file:
        path: /etc/systemd/system/ziti-edge-tunnel.service.d
        state: directory
        mode: '0755'
      become: true
    - name: override service to run as root
      copy:
        dest: /etc/systemd/system/ziti-edge-tunnel.service.d/override.conf
        content: |
          [Service]
          User=
        mode: '0644'
      register: override
      become: true
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      when: override.changed

