name: ICS


services:

  logingateway:
    build:
      context: .
      dockerfile: webauth/logingateway/Dockerfile
    container_name: logingateway
    depends_on:
      ziti-tunneler-logingateway:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@ziti.db:5432/app
      SECRET_KEY: ${SECRET_KEY_GATEWAY}
      PYTHONPATH: /app/logingateway
    network_mode: service:ziti-tunneler-logingateway

  ziti-tunneler-logingateway:
    image: ${ZITI_ROUTER_IMAGE:-openziti/ziti-router:1.6.12}
    container_name: ziti-tunneler-logingateway
    depends_on:
      ziti-tunneler-logingateway-init:
        condition: service_completed_successfully
    volumes:
      - ziti-logingateway:/ziti-router
      - ./ziti/enroll.sh:/ziti-router/enroll.sh
    environment:
      ZITI_CTRL_ADVERTISED_ADDRESS: ${ZITI_CTRL_ADVERTISED_ADDRESS:-}
      ZITI_CTRL_ADVERTISED_PORT: ${ZITI_CTRL_ADVERTISED_PORT:-}
      ZITI_ROUTER_ADVERTISED_ADDRESS: ${ZITI_ROUTER_ADVERTISED_ADDRESS:-ziti-tunneler-logingateway}
      ZITI_ROUTER_PORT: ${ZITI_ROUTER_PORT:-3022}
      ZITI_ROUTER_MODE: ${ZITI_ROUTER_MODE:-tproxy}
      ZITI_AUTO_RENEW_CERTS: true
      ZITI_ROUTER_TYPE: ${ZITI_ROUTER_TYPE:-edge}
    networks:
      - ziti
    command: run config.yml
    entrypoint:
      - /ziti-router/enroll.sh
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - ziti
        - agent
        - stats
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 15s
    user: root
    cap_add:
      - NET_ADMIN
    dns:
      - 127.0.0.1
      - 1.1.1.1

  ziti-tunneler-logingateway-host:
    image: ${ZITI_ROUTER_IMAGE:-openziti/ziti-router:1.6.12}
    container_name: ziti-tunneler-logingateway-host
    depends_on:
      ziti-tunneler-logingateway-host-init:
        condition: service_completed_successfully
    volumes:
      - ziti-logingateway-host:/ziti-router
      - ./ziti/enroll.sh:/ziti-router/enroll.sh
    environment:
      ZITI_CTRL_ADVERTISED_ADDRESS: ${ZITI_CTRL_ADVERTISED_ADDRESS:-}
      ZITI_CTRL_ADVERTISED_PORT: ${ZITI_CTRL_ADVERTISED_PORT:-}
      ZITI_ROUTER_ADVERTISED_ADDRESS: ${ZITI_ROUTER_ADVERTISED_ADDRESS:-ziti-tunneler-logingateway-host}
      ZITI_ROUTER_PORT: 3032
      ZITI_ROUTER_MODE: ${ZITI_ROUTER_MODE:-host}
      ZITI_BOOTSTRAP: true
      ZITI_BOOTSTRAP_CONFIG: true
      ZITI_BOOTSTRAP_ENROLLMENT: true
      ZITI_AUTO_RENEW_CERTS: true
      ZITI_ROUTER_TYPE: ${ZITI_ROUTER_TYPE:-edge}
      ZITI_BOOTSTRAP_CONFIG_ARGS: null
    network_mode: service:ziti-tunneler-logingateway
    command: run config.yml
    entrypoint:
      - /ziti-router/enroll.sh
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - ziti
        - agent
        - stats
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 15s
    user: ${ZIGGY_UID:-2171}

  ziti-tunneler-logingateway-host-init:
    image: openziti/ziti-cli:1.6.12
    container_name: ziti-tunneler-logingateway-host-init
    depends_on:
      ziti-controller:
        condition: service_healthy
    volumes:
      - ziti-logingateway-host:/ziti-router
      - ./webauth/logingateway/bootstrap_tunneler_logingateway_host.sh:/bootstrap.sh
    environment:
      - ZITI_USER=${ZITI_USER:-admin}
      - ZITI_PWD=${ZITI_PWD}
      - ZITI_CTRL_EDGE_ADVERTISED_PORT=${ZITI_CTRL_EDGE_ADVERTISED_PORT:-}
    networks:
      - ziti
    entrypoint:
      - /bin/sh
      - /bootstrap.sh

  ziti-tunneler-logingateway-init:
    image: openziti/ziti-cli:1.6.12 
    container_name: ziti-tunneler-logingateway-init
    depends_on:
      ziti-controller:
        condition: service_healthy
    volumes:
      - ziti-logingateway:/ziti-router
      - ./webauth/logingateway/bootstrap_tunneler_logingateway.sh:/bootstrap.sh
    environment:
      - ZITI_USER=${ZITI_USER:-admin}
      - ZITI_PWD=${ZITI_PWD}
      - ZITI_CTRL_EDGE_ADVERTISED_PORT=${ZITI_CTRL_EDGE_ADVERTISED_PORT:-}
    networks:
      - ziti
    entrypoint:
      - /bin/sh
      - /bootstrap.sh
    user: root


volumes:
  ziti-logingateway: null
  ziti-logingateway-host: null
